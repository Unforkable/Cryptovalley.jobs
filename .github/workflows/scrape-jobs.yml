name: Scrape Jobs

on:
  schedule:
    # Off the hour: GitHub drops scheduled runs at :00 under load (it skipped 2026-11-03)
    - cron: "17 6 * * *" # Daily at 6:17 UTC (7:17 CET)
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: read
  actions: write # for the keepalive step below

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # GitHub disables scheduled workflows after 60 days without repo
      # activity, which silently empties the board (jobs expire after 30 days).
      # Re-enabling via the API resets that timer. Runs first so it still
      # happens if a later step fails.
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape-jobs.yml/enable"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install browser for crawl4ai
        run: |
          playwright install chromium --with-deps
          python -m crawl4ai.install

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/scrape_jobs.py

      - name: Send job alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: https://cryptovalley.jobs
        run: python scripts/send_alerts.py
